<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Live Math Workspace</title>
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Desmos API -->
    <script src="https://www.desmos.com/api/v1.8/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Inter', sans-serif; background: #eef2f6; overflow: hidden; }
        
        /* Premium Role Selection Overlay */
        #role-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 24px; }
        .role-title { color: white; font-weight: 500; font-size: 28px; letter-spacing: -0.5px; margin-bottom: 10px; text-align: center; }
        
        .auth-box { background: white; padding: 30px; border-radius: 16px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); text-align: center; min-width: 300px; }
        .auth-box input { padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; outline: none; }
        .auth-box input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        .role-btn { padding: 16px 36px; font-size: 16px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .role-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15); }
        .btn-instructor { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; width: 100%; }
        .btn-student { background: transparent; color: white; border: 2px solid white; margin-top: 20px; }

        /* Floating Modern Toolbar */
        #toolbar-wrapper { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; width: 100%; display: flex; justify-content: center; }
        #toolbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 16px; padding: 12px 20px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); pointer-events: auto; flex-wrap: wrap; max-width: 95vw; }
        
        #toolbar button, #toolbar input, #toolbar select { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; cursor: pointer; background: white; font-weight: 500; color: #334155; }
        #toolbar button:hover { background: #f8fafc; border-color: #cbd5e1; }
        #toolbar input[type="text"] { cursor: text; min-width: 200px; }
        
        .primary-btn { background: #2563eb !important; color: white !important; border: none !important; }
        .primary-btn:hover { background: #1d4ed8 !important; }
        .danger-btn { background: #ef4444 !important; color: white !important; border: none !important; }
        
        .instructor-only, .student-only { display: none; align-items: center; gap: 12px; }
        .instructor-tag { background: #eff6ff; padding: 10px 16px; border-radius: 8px; border: 1px solid #bfdbfe; color: #1e40af; font-weight: 600; display: flex; gap: 10px; align-items: center;}
        #my-id { font-family: 'Courier New', monospace; font-size: 15px; color: #1e3a8a; user-select: all; background: white; padding: 4px 8px; border-radius: 4px;}
        .divider { width: 1px; height: 32px; background: #e2e8f0; margin: 0 4px; }
        
        #color-picker { padding: 2px !important; width: 42px; height: 42px; cursor: pointer; }
        input[type=range] { padding: 0 !important; cursor: pointer; }
        
        /* 4-Way Scrollable Workspace */
        #workspace { flex-grow: 1; position: relative; overflow: auto; background: #e2e8f0; width: 100vw; height: 100vh; cursor: grab; }
        #workspace:active { cursor: grabbing; }
        canvas { background: #ffffff; cursor: crosshair; box-shadow: 0 0 40px rgba(0,0,0,0.05); display: block; }
        
        /* Floating Panels (Desmos & Screen Share) */
        .draggable-panel { display: none; position: fixed; z-index: 100; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid #cbd5e1; background: white; resize: both; overflow: hidden; min-width: 300px; min-height: 250px; }
        .drag-handle { background: #f8fafc; color: #334155; padding: 10px 16px; font-size: 14px; cursor: move; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        
        /* Specific Panel Initial Sizes */
        #desmos-container { top: 100px; right: 30px; width: 500px; height: 550px; }
        #screenshare-container { top: 100px; left: 30px; width: 600px; height: 450px; }
        
        #calculator { width: 100%; height: calc(100% - 40px); }
        #screenshare-video { width: 100%; height: calc(100% - 40px); background: #000; object-fit: contain; }

        /* Camera Video Panel */
        #video-container { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 16px; align-items: flex-end; z-index: 150; pointer-events: none; }
        video.cam-video { background: #0f172a; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); pointer-events: auto; object-fit: cover; }
        #local-video { width: 140px; height: 105px; border: 2px solid white; }
        #remote-video { width: 280px; height: 210px; border: 3px solid #2563eb; display: none; }
        
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; display: none; z-index: 9999; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <!-- Premium Role Selection -->
    <div id="role-overlay">
        <h2 class="role-title">Live Mathematics Workspace</h2>
        
        <div class="auth-box">
            <div style="color: #64748b; font-size: 14px; font-weight: 500;">Instructor Login</div>
            <!-- INSTRUCTOR SECURE PIN INPUT -->
            <input type="password" id="instructor-pin" placeholder="Enter Secure PIN">
            <button class="role-btn btn-instructor" onclick="verifyInstructor()">Open Classroom</button>
        </div>
        
        <button class="role-btn btn-student" onclick="initSession('student')">Join as Student</button>
    </div>

    <!-- Floating Toolbar -->
    <div id="toolbar-wrapper">
        <div id="toolbar">
            <div id="instructor-tools" class="instructor-only">
                <div class="instructor-tag">
                    <span>Room ID:</span>
                    <span id="my-id">Generating...</span>
                </div>
            </div>
            
            <div id="student-tools" class="student-only">
                <input type="text" id="join-id" placeholder="Paste Room ID here...">
                <button class="primary-btn" onclick="joinRoom()">Connect</button>
            </div>
            
            <div class="divider"></div>
            
            <select id="tool-select">
                <option value="pen">🖊️ Pen</option>
                <option value="eraser">🧽 Eraser</option>
            </select>
            <input type="color" id="color-picker" value="#0f172a" title="Marker Color">
            <input type="range" id="line-width" min="1" max="20" value="3" title="Line Thickness">
            <button onclick="recenterCanvas()" title="Return to center of board">🎯 Center</button>
            <button onclick="clearCanvas()">🗑️ Clear</button>
            
            <div class="divider"></div>
            
            <button id="btn-mute" onclick="toggleMute()">🎙️ Mute</button>
            <button id="btn-video" onclick="toggleVideo()">📹 Cam</button>
            <button class="primary-btn" id="btn-screen" onclick="toggleScreenShare()">📺 Share Screen</button>
            <button class="primary-btn" onclick="toggleDesmos()">📈 Desmos</button>
            
            <div class="divider"></div>
            <button class="danger-btn" onclick="leaveClassroom()">End</button>
        </div>
    </div>
    
    <!-- 4-Way Scrollable Workspace -->
    <div id="workspace">
        <canvas id="whiteboard"></canvas>
    </div>

    <!-- Resizable Desmos Panel -->
    <div id="desmos-container" class="draggable-panel">
        <div id="desmos-drag-handle" class="drag-handle">
            <span>Graphing Calculator</span>
            <span style="cursor:pointer; color:#ef4444;" onclick="toggleDesmos()">✕</span>
        </div>
        <div id="calculator"></div>
    </div>

    <!-- Resizable Screen Share Panel -->
    <div id="screenshare-container" class="draggable-panel">
        <div id="screenshare-drag-handle" class="drag-handle">
            <span>Shared Screen</span>
            <span style="cursor:pointer; color:#ef4444;" onclick="stopScreenShare()">✕</span>
        </div>
        <video id="screenshare-video" autoplay playsinline></video>
    </div>

    <!-- Camera Video Panel -->
    <div id="video-container">
        <video id="local-video" class="cam-video" autoplay muted playsinline></video>
        <video id="remote-video" class="cam-video" autoplay playsinline></video>
    </div>

    <div id="toast">Message</div>

    <script>
        // --- SECURE PIN CONFIGURATION ---
        // Change "VANI-MATH" to whatever secret password you want to use.
        const INSTRUCTOR_SECRET_PIN = "VANI-MATH";

        // --- Core Setup ---
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const workspace = document.getElementById('workspace');
        
        const CANVAS_SIZE = 15000;
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        let isDrawing = false;
        let connections = [];
        let connectedStudentIDs = [];
        let peer, localStream, currentCall, userRole;
        
        let screenStream = null;
        let screenCalls = [];

        // --- Authentication ---
        function verifyInstructor() {
            const enteredPin = document.getElementById('instructor-pin').value;
            if (enteredPin === INSTRUCTOR_SECRET_PIN) {
                initSession('instructor');
            } else {
                alert("Incorrect PIN. Only the authorized instructor can open a classroom.");
            }
        }

        // --- Canvas Panning & Scrolling ---
        function recenterCanvas() {
            workspace.scrollLeft = (CANVAS_SIZE / 2) - (window.innerWidth / 2);
            workspace.scrollTop = (CANVAS_SIZE / 2) - (window.innerHeight / 2);
        }
        recenterCanvas();

        let isPanning = false, startPanX, startPanY, startScrollLeft, startScrollTop;
        workspace.addEventListener('mousedown', (e) => {
            if (e.button === 1 || e.shiftKey) { 
                isPanning = true;
                startPanX = e.clientX; startPanY = e.clientY;
                startScrollLeft = workspace.scrollLeft; startScrollTop = workspace.scrollTop;
                e.preventDefault();
            }
        });
        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            workspace.scrollLeft = startScrollLeft - (e.clientX - startPanX);
            workspace.scrollTop = startScrollTop - (e.clientY - startPanY);
        });
        window.addEventListener('mouseup', () => { isPanning = false; });

        // --- Panel Dragging Logic (For both Desmos & Screen Share) ---
        function makeDraggable(elementId, handleId) {
            const el = document.getElementById(elementId);
            const handle = document.getElementById(handleId);
            let isDraggingWin = false, startX, startY;

            handle.addEventListener('mousedown', (e) => {
                isDraggingWin = true;
                startX = e.clientX - el.offsetLeft;
                startY = e.clientY - el.offsetTop;
                // Bring to front
                document.querySelectorAll('.draggable-panel').forEach(p => p.style.zIndex = 100);
                el.style.zIndex = 101;
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDraggingWin) return;
                el.style.left = (e.clientX - startX) + 'px';
                el.style.top = (e.clientY - startY) + 'px';
            });
            document.addEventListener('mouseup', () => { isDraggingWin = false; });
        }
        
        makeDraggable('desmos-container', 'desmos-drag-handle');
        makeDraggable('screenshare-container', 'screenshare-drag-handle');

        // --- Desmos Initialization ---
        const calcElement = document.getElementById('calculator');
        const calculator = Desmos.GraphingCalculator(calcElement, { expressions: true, settingsMenu: true });
        
        const resizeObserver = new ResizeObserver(() => { calculator.resize(); });
        resizeObserver.observe(document.getElementById('desmos-container'));

        // --- Session Initialization ---
        function initSession(role) {
            userRole = role;
            document.getElementById('role-overlay').style.display = 'none';
            
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                })
                .catch(err => showToast("Camera/Mic access denied."));

            peer = new Peer();

            if (role === 'instructor') {
                document.getElementById('instructor-tools').style.display = 'flex';
                peer.on('open', (id) => { document.getElementById('my-id').innerText = id; });
                
                // Instructor receiving calls (from students)
                peer.on('call', (call) => {
                    currentCall = call;
                    call.answer(localStream);
                    
                    call.on('stream', (remoteStream) => {
                        const remoteVideo = document.getElementById('remote-video');
                        remoteVideo.srcObject = remoteStream;
                        remoteVideo.style.display = 'block';
                    });
                });
                
                // Instructor receiving data connection
                peer.on('connection', (conn) => {
                    setupDataConnection(conn);
                    if (!connectedStudentIDs.includes(conn.peer)) {
                        connectedStudentIDs.push(conn.peer);
                    }
                });
            } else {
                // Student Mode
                document.getElementById('student-tools').style.display = 'flex';
                document.getElementById('btn-screen').style.display = 'none'; // Only instructor shares screen
                
                peer.on('call', (call) => {
                    // Check if this incoming call is a screen share or normal camera
                    if (call.metadata && call.metadata.type === 'screenshare') {
                        call.answer(); // Don't send our camera back for a screen share stream
                        call.on('stream', (stream) => {
                            document.getElementById('screenshare-video').srcObject = stream;
                            document.getElementById('screenshare-container').style.display = 'block';
                        });
                    }
                });
            }
        }

        // Student joining the instructor
        function joinRoom() {
            const id = document.getElementById('join-id').value.trim();
            if (!id) return;
            
            const conn = peer.connect(id);
            setupDataConnection(conn);

            if (localStream) {
                currentCall = peer.call(id, localStream);
                currentCall.on('stream', (remoteStream) => {
                    const remoteVideo = document.getElementById('remote-video');
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.style.display = 'block';
                });
            }
        }

        // --- WebRTC Data Sync (Whiteboard) ---
        function setupDataConnection(conn) {
            connections.push(conn);
            conn.on('open', () => showToast("Securely connected to classroom!"));
            conn.on('data', (data) => {
                if (data.type === 'draw') {
                    drawLine(data.x0, data.y0, data.x1, data.y1, data.color, data.width, data.tool, false);
                } else if (data.type === 'clear') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                } else if (data.type === 'image') {
                    drawImageFromData(data.src, data.x, data.y);
                } else if (data.type === 'stop-screenshare') {
                    document.getElementById('screenshare-container').style.display = 'none';
                }
            });
        }

        function broadcast(data) {
            connections.forEach(conn => {
                if (conn.open) conn.send(data);
            });
        }

        // --- Drawing Engine ---
        let lastX = 0, lastY = 0;

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function drawLine(x0, y0, x1, y1, color, width, tool, emit) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            if (tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = width * 4; 
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.closePath();
            ctx.globalCompositeOperation = 'source-over';

            if (emit) broadcast({ type: 'draw', x0, y0, x1, y1, color, width, tool });
        }

        canvas.addEventListener('mousedown', (e) => { 
            if (e.button === 1 || e.shiftKey) return; 
            isDrawing = true; 
            const coords = getCoordinates(e); 
            lastX = coords.x; lastY = coords.y; 
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const coords = getCoordinates(e);
            drawLine(lastX, lastY, coords.x, coords.y, document.getElementById('color-picker').value, document.getElementById('line-width').value, document.getElementById('tool-select').value, true);
            lastX = coords.x; lastY = coords.y;
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        // --- Image Pasting ---
        window.addEventListener('paste', function(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64data = event.target.result;
                        const x = workspace.scrollLeft + (window.innerWidth / 2) - 200;
                        const y = workspace.scrollTop + (window.innerHeight / 2) - 200;
                        drawImageFromData(base64data, x, y);
                        broadcast({ type: 'image', src: base64data, x: x, y: y });
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        function drawImageFromData(src, x, y) {
            const img = new Image();
            img.onload = function() { ctx.drawImage(img, x, y); };
            img.src = src;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            broadcast({ type: 'clear' });
        }

        // --- Media Controls ---
        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            const btn = document.getElementById('btn-mute');
            btn.innerText = audioTrack.enabled ? "🎙️ Mute" : "🔇 Unmute";
            btn.style.background = audioTrack.enabled ? "" : "#fee2e2";
        }

        function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            const btn = document.getElementById('btn-video');
            btn.innerText = videoTrack.enabled ? "📹 Cam On" : "📸 Cam Off";
            btn.style.background = videoTrack.enabled ? "" : "#fee2e2";
        }

        // --- Separate Window Screen Sharing ---
        async function toggleScreenShare() {
            if (screenStream) {
                stopScreenShare();
                return;
            }
            
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                
                // Show locally in the separate panel
                document.getElementById('screenshare-video').srcObject = screenStream;
                document.getElementById('screenshare-container').style.display = 'block';
                document.getElementById('btn-screen').innerText = "📺 Stop Share";

                // Call all connected students with the screen stream on a separate channel
                connectedStudentIDs.forEach(studentId => {
                    const screenCall = peer.call(studentId, screenStream, { metadata: { type: 'screenshare' } });
                    screenCalls.push(screenCall);
                });

                // Listen for browser "Stop Sharing" button
                screenStream.getVideoTracks()[0].onended = () => { stopScreenShare(); };
                showToast("Screen sharing started.");
            } catch (e) {
                console.error("Screen share error", e);
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            screenCalls.forEach(call => call.close());
            screenCalls = [];
            
            document.getElementById('screenshare-container').style.display = 'none';
            document.getElementById('btn-screen').innerText = "📺 Share Screen";
            broadcast({ type: 'stop-screenshare' });
            showToast("Screen sharing stopped.");
        }

        function toggleDesmos() {
            const panel = document.getElementById('desmos-container');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if (panel.style.display === 'block') calculator.resize();
        }

        function leaveClassroom() {
            if (confirm("End the session?")) {
                if (peer) peer.destroy();
                if (localStream) localStream.getTracks().forEach(track => track.stop());
                if (screenStream) screenStream.getTracks().forEach(track => track.stop());
                document.body.innerHTML = "<div style='display:flex; height:100vh; align-items:center; justify-content:center;'><h1 style='color: #334155;'>Session Ended</h1></div>";
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
